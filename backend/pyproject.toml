[project]
name = "coachlm-backend"
version = "0.1.0"
description = "CoachLM Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.127.0",
    "uvicorn[standard]>=0.40.0",
    "psycopg[binary]>=3.3.2",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.4.2",
    "langchain>=1.2.0",
    "langchain-core>=1.2.4",
    "langgraph>=1.0.5",
    "langchain-openai>=1.1.5",
    "yoyo-migrations>=8.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]